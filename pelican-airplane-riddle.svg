    <path d="M930 375 Q1013 427 1108 394 Q1065 460 954 432 Q922 415 930 375Z" fill="#f3a13a" stroke="#713918" stroke-width="7"/>
    <path d="M951 385 Q1027 401 1092 390" fill="none" stroke="#8d431c" stroke-width="4"/>
    <!-- 腿与脚蹬 -->
    <path d="M735 618 Q714 666 704 701 M812 618 Q825 690 801 765" fill="none" stroke="#d28a21" stroke-width="18"/>
    <path d="M704 701 L748 735 M801 765 L824 766" fill="none" stroke="#683f1e" stroke-width="12"/>
    <!-- 飞行眼镜 -->
