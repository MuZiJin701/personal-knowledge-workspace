      <path d="M1270 306 Q1305 272 1345 307 L1337 330 Q1305 314 1276 332Z" fill="#7e3f23"/>
      <path d="M1271 302 Q1308 320 1343 302" fill="none" stroke="#f1c73c" stroke-width="11"/>
      <circle cx="1344" cy="302" r="9" fill="#e43b31"/>
      <path d="M1277 328 Q1307 306 1337 328 L1327 357 Q1305 372 1285 354Z" fill="#d99b56"/>
      <path d="M1287 332 Q1297 324 1304 333 M1318 332 Q1327 324 1333 333" fill="none" stroke="#2d1c14" stroke-width="4"/>
