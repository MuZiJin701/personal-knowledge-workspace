    <ellipse cx="877" cy="437" rx="66" ry="46" fill="#edf5f4"/>
    <path d="M683 381 Q673 278 756 235 Q850 188 954 252 Q1011 287 972 393 Q940 458 842 461 L745 442 Q699 431 683 381Z" fill="#f8fcf8"/>
    <path d="M713 385 Q797 424 931 395" fill="none" stroke="#c5d7da" stroke-width="7"/>
    <!-- 头 -->
    <circle cx="949" cy="257" r="91" fill="#f9fcf8"/>
    <circle cx="891" cy="193" r="31" fill="#edf5f4"/>
    <circle cx="1007" cy="197" r="31" fill="#edf5f4"/>
    <circle cx="891" cy="193" r="14" fill="#81939a" stroke="none"/>
    <circle cx="1007" cy="197" r="14" fill="#81939a" stroke="none"/>
