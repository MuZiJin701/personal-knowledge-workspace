  <!-- 鹈鹕喊出的答案 -->
  <g filter="url(#shadow)">
    <path d="M88 92 H481 Q520 92 520 132 V264 Q520 304 481 304 H347 L306 369 L291 304 H88 Q48 304 48 264 V132 Q48 92 88 92Z" fill="#fffdf3" stroke="#293844" stroke-width="10"/>
