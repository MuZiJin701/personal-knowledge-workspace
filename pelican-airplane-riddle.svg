<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕在孙悟空驾驶的飞机机翼上骑自行车，托着北极熊与秦始皇</title>
  <desc id="desc">一幅细节丰富的幻想插画。孙悟空驾驶大型飞机，鹈鹕展开翅膀在机翼上骑自行车，翅膀托着北极熊，秦始皇骑在熊上拧螺丝。鹈鹕喊出糖果题答案二十一。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1769aa"/>
      <stop offset="0.54" stop-color="#73c9ef"/>
      <stop offset="1" stop-color="#ffd7a2"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffce0"/>
      <stop offset="0.45" stop-color="#ffe57b" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffd45b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.35" stop-color="#dce8ee"/>
      <stop offset="0.68" stop-color="#9cbbc9"/>
      <stop offset="1" stop-color="#5a8398"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#f9fdff"/>
      <stop offset="0.45" stop-color="#cbdde5"/>
      <stop offset="0.75" stop-color="#86a9b9"/>
      <stop offset="1" stop-color="#496e82"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a0"/>
      <stop offset="0.35" stop-color="#e7b42c"/>
      <stop offset="0.72" stop-color="#a86109"/>
      <stop offset="1" stop-color="#ffe173"/>
    </linearGradient>
    <linearGradient id="redSilk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f24d45"/>
      <stop offset="0.52" stop-color="#9e171d"/>
      <stop offset="1" stop-color="#560b16"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="0.55" stop-color="#d6e4e7"/>
      <stop offset="1" stop-color="#8eaab2"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd750"/>
      <stop offset=".55" stop-color="#ef9d1d"/>
      <stop offset="1" stop-color="#b95014"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="rivets" width="55" height="24" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="2.2" fill="#587787" opacity=".7"/>
    </pattern>
    <clipPath id="cockpitClip">
      <path d="M1195 347 Q1260 270 1355 304 L1404 352 Q1308 360 1195 347Z"/>
    </clipPath>
  </defs>

  <!-- 天空 -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1330" cy="150" r="190" fill="url(#sun)"/>
  <g fill="#fff" opacity=".8" filter="url(#soft)">
    <path d="M35 290 C120 220 185 260 218 295 C280 230 370 270 390 327 H35Z"/>
    <path d="M1120 160 C1185 105 1242 128 1270 169 C1324 118 1402 148 1430 203 H1120Z"/>
    <path d="M95 515 C145 475 204 485 235 526 C278 482 345 500 366 550 H95Z" opacity=".55"/>
  </g>
  <g fill="none" stroke="#e9f9ff" stroke-width="5" stroke-linecap="round" opacity=".8">
    <path d="M82 410 Q105 390 128 410 Q151 390 174 410"/>
    <path d="M1020 246 Q1041 228 1062 246 Q1083 228 1104 246"/>
  </g>
  <path d="M0 873 Q240 780 430 852 T810 858 T1190 832 T1600 862 V1000 H0Z" fill="#386f84" opacity=".25"/>

