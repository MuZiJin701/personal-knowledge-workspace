      <path d="M954 641 V867 M841 754 H1067 M874 674 L1034 834 M874 834 L1034 674"/>
    </g>
    <g fill="none" stroke="#b92728" stroke-width="18">
      <path d="M592 730 L748 735 L690 602 L592 730 L728 626 L886 650 L954 754"/>
      <path d="M748 735 L886 650"/>
    </g>
    <circle cx="748" cy="735" r="25" fill="url(#gold)" stroke="#5e3c11" stroke-width="7"/>
    <path d="M748 735 L801 766 M748 735 L699 702" stroke="#263944" stroke-width="10"/>
    <path d="M785 766 H825 M672 593 H718" stroke="#1f2b31" stroke-width="14"/>
    <path d="M885 650 L866 565 L914 552 M866 565 L834 575" fill="none" stroke="#263944" stroke-width="13"/>
