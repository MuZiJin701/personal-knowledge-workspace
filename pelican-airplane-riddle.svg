      <path d="M1250 374 Q1298 344 1365 374" fill="#d92d29" stroke="#5a1717" stroke-width="5"/>
    </g>
    <path d="M1262 292 L1276 356 M1361 306 L1346 357" stroke="#aac6d2" stroke-width="7"/>
    <circle cx="1494" cy="405" r="8" fill="#f33" filter="url(#glow)"/>
  </g>

