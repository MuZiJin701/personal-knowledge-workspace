<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>秦始皇骑自行车 · SVG 动画</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #211f25; }
    svg { display: block; width: min(100%, 1600px); height: auto; max-height: 100vh; background: #efe0bc; }
    .wheel, .crank { transform-box: fill-box; transform-origin: center; animation: roll 1.1s linear infinite; }
    .rider { animation: bounce .55s ease-in-out infinite alternate; }
    .robe-tail { transform-origin: 522px 377px; animation: flutter 1.1s ease-in-out infinite alternate; }
    .tassel { transform-origin: 574px 201px; animation: flutter .7s ease-in-out infinite alternate; }
    .cloud-left { animation: drift 18s linear infinite alternate; }
    .cloud-right { animation: drift 24s linear infinite alternate-reverse; }
    .road-mark { animation: road 1.1s linear infinite; }
    .road-mark.slow { animation-duration: 1.65s; }
    @keyframes roll { to { transform: rotate(360deg); } }
    @keyframes bounce { to { transform: translateY(4px); } }
    @keyframes flutter { to { transform: rotate(-6deg) translateX(-7px); } }
    @keyframes drift { to { transform: translateX(35px); } }
    @keyframes road { to { transform: translateX(-223px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
    <title id="title">秦始皇骑自行车</title>
    <desc id="description">身着玄色龙袍、头戴冕冠的秦始皇骑着自行车穿过山峦。车轮、踏板和道路持续运动。</desc>
    <defs>
      <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#f7edcf"/><stop offset="1" stop-color="#d9bc91"/></linearGradient>
      <linearGradient id="road" x2="0" y2="1"><stop stop-color="#b99068"/><stop offset="1" stop-color="#806047"/></linearGradient>
      <linearGradient id="robe" x2="0" y2="1"><stop stop-color="#353b42"/><stop offset="1" stop-color="#151c25"/></linearGradient>
      <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="6" r=".7" fill="#65462b" opacity=".14"/><circle cx="17" cy="19" r=".6" fill="#65462b" opacity=".12"/></pattern>
      <g id="spoke" stroke="#b3a18c" stroke-width="2"><path d="M0-81V81M-81 0H81M-57-57 57 57M57-57-57 57"/></g>
      <g id="cloud" fill="#fff6dc" opacity=".75"><path d="M0 16c20 0 27-6 36-19 10 8 23 9 34 2 14-9 32-7 42 5 9 11 24 12 44 12-11 8-28 12-47 9H39C22 27 9 23 0 16Z"/></g>
    </defs>

    <!-- Landscape -->
    <path fill="url(#sky)" d="M0 0h1200v720H0z"/>
    <circle cx="859" cy="198" r="112" fill="#c95f42" opacity=".88"/>
    <circle cx="859" cy="198" r="133" fill="none" stroke="#f8ecc9" stroke-width="2" opacity=".5"/>
    <g class="cloud-left"><use href="#cloud" x="94" y="151"/><use href="#cloud" x="210" y="237" transform="scale(.6)"/></g>
    <g class="cloud-right"><use href="#cloud" x="901" y="93"/><use href="#cloud" x="1603" y="342" transform="scale(.6)"/></g>
    <path d="M0 403 110 320l65 50 152-132 150 139 89-76 145 102 156-123 120 112 113-65v208H0Z" fill="#8b978a" opacity=".44"/>
    <path d="M0 461 109 398l71 30 136-111 111 127 114-84 125 88 136-110 121 92 122-79 155 102v120H0Z" fill="#60756d" opacity=".55"/>
    <path d="M0 492q165-53 312-13t294 0q141-46 292-6t302-12v110H0Z" fill="#656f5f"/>
    <path d="M0 515q231-35 409 2t391-9q206-48 400 7v104H0Z" fill="#49574c"/>
    <path d="M0 552h1200v168H0Z" fill="url(#road)"/>
    <path d="M0 553h1200" stroke="#dec597" stroke-width="5" opacity=".75"/>
    <path d="M0 652h1200" stroke="#5f493c" stroke-width="3" opacity=".55"/>
    <g class="road-mark" fill="#ebd4a8" opacity=".76"><rect x="46" y="615" width="86" height="5" rx="2"/><rect x="269" y="615" width="86" height="5" rx="2"/><rect x="492" y="615" width="86" height="5" rx="2"/><rect x="715" y="615" width="86" height="5" rx="2"/><rect x="938" y="615" width="86" height="5" rx="2"/><rect x="1161" y="615" width="86" height="5" rx="2"/><rect x="1384" y="615" width="86" height="5" rx="2"/></g>
    <g class="road-mark slow" stroke="#e4cfab" stroke-width="3" opacity=".55"><path d="M92 572h48m66 0h26m809 0h68M130 691h74m736 0h97"/></g>
    <path fill="url(#grain)" d="M0 0h1200v720H0z" pointer-events="none"/>

    <!-- Bicycle shadow -->
    <ellipse cx="607" cy="637" rx="282" ry="21" fill="#302e2c" opacity=".23"/>

    <!-- Wheels -->
    <g transform="translate(430 526)"><g class="wheel"><circle r="101" fill="none" stroke="#242e32" stroke-width="17"/><circle r="92" fill="none" stroke="#d9ccb1" stroke-width="3"/><use href="#spoke"/><circle r="11" fill="#d8ae5b" stroke="#2e3535" stroke-width="4"/></g></g>
    <g transform="translate(785 526)"><g class="wheel"><circle r="101" fill="none" stroke="#242e32" stroke-width="17"/><circle r="92" fill="none" stroke="#d9ccb1" stroke-width="3"/><use href="#spoke"/><circle r="11" fill="#d8ae5b" stroke="#2e3535" stroke-width="4"/></g></g>

    <!-- Frame and steering -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="m430 526 124-127 23 120-147 7 124-127 143-4-120 124 120-124 88 131" stroke="#172d35" stroke-width="12"/>
      <path d="m430 526 124-127 23 120-147 7 124-127 143-4-120 124 120-124 88 131" stroke="#d3a453" stroke-width="5"/>
      <path d="m697 395-12-36h50m-38 36 24-35" stroke="#26343a" stroke-width="11"/>
      <path d="M718 357h38" stroke="#d4a754" stroke-width="8"/>
      <path d="M538 393h49" stroke="#26343a" stroke-width="10"/>
      <path d="M551 390h34" stroke="#e0b96c" stroke-width="4"/>
    </g>
    <circle cx="577" cy="519" r="18" fill="#d5ab5e" stroke="#26343a" stroke-width="6"/>
    <g transform="translate(577 519)"><g class="crank" stroke="#24333a" stroke-width="8" stroke-linecap="round"><path d="M0-38v76"/><path d="M-20-38h39M-20 38h39" stroke="#e0b569" stroke-width="7"/></g></g>

    <!-- Emperor -->
    <g class="rider">
      <!-- Back of the robe streams in the wind -->
      <g class="robe-tail"><path d="M527 375q-59-5-101 11-35 11-66-8 31 48 69 57-34 9-61 2 34 41 91 35 38-2 77-35Z" fill="#1c2630" stroke="#d0a753" stroke-width="4"/><path d="M466 413q-41 7-68-8m70 38q-30 12-62 7" fill="none" stroke="#c69a4e" stroke-width="3" opacity=".8"/></g>
      <!-- Boots and bent legs -->
      <path d="m563 418 38 53-26 49" fill="none" stroke="#25313a" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m547 423-25 55 48 38" fill="none" stroke="#192630" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m569 514 24 8-4 14-36-2-1-12Z" fill="#171c22" stroke="#d2a252" stroke-width="3"/>
      <path d="m571 514 22 7-4 14-34-2-1-11Z" fill="#1e2328" stroke="#d2a252" stroke-width="3"/>
      <!-- Robe body -->
      <path d="M529 323q-18 18-27 56l-22 62q28 23 85 24 30-2 70-23l-44-107Z" fill="url(#robe)" stroke="#c9a052" stroke-width="5"/>
      <path d="M555 323 543 452m10-98 48 93" stroke="#bd8c46" stroke-width="5" fill="none"/>
      <path d="M560 354q10 13 30 10m-39 21q23 12 45 5" fill="none" stroke="#e3bf73" stroke-width="3" opacity=".8"/>
      <path d="M578 374q-13-11-20 5 5 18 20 10 10 14 22-1-7-8-16-8 10-8 3-13Z" fill="#c59d59" opacity=".85"/>
      <circle cx="576" cy="389" r="4" fill="#222b2b"/>
      <!-- Sleeve and hand on handlebar -->
      <path d="M593 346q35 5 52 34l42 10-3 27q-42 0-72-16l-29-21Z" fill="#252d35" stroke="#c69b4c" stroke-width="5"/>
      <path d="m673 391 21 3 7 8-10 10-22-7Z" fill="#c18b64" stroke="#704e3f" stroke-width="3"/>
      <path d="M690 403h29" stroke="#2b3334" stroke-width="7" stroke-linecap="round"/>
      <!-- Neck and face -->
      <path d="M548 316v26q14 15 30 0v-27Z" fill="#b97d58"/>
      <path d="M527 240q-7 17 1 46 7 38 32 48 25-6 37-41 8-29-3-52Z" fill="#c8926d" stroke="#6f4a3c" stroke-width="3"/>
      <path d="M525 264q-9 30 5 48l7-8-3-37Zm69 0q13 24 0 47l-7-8 2-35Z" fill="#24272a"/>
      <path d="M535 279q10-7 21 0m22 0q10-7 20 0" stroke="#292727" stroke-width="6" stroke-linecap="round"/>
      <path d="M540 287h13m27 0h13" stroke="#26282b" stroke-width="3" stroke-linecap="round"/>
      <path d="m568 285-4 13 8 2" fill="none" stroke="#9e634c" stroke-width="3"/>
      <path d="M552 305q11-8 18-1 10-7 21 1-12 7-21 5-9 2-18-5Z" fill="#20262b"/>
      <path d="M558 311q-5 21 10 34l4-22 4 22q15-13 10-34-15 8-28 0Z" fill="#25282c"/>
      <!-- Imperial crown and bead curtain -->
      <path d="M522 236q23-11 76 0l-4 23q-31 10-66 0Z" fill="#1a2329" stroke="#d5ad64" stroke-width="5"/>
      <path d="M507 222q58-25 104 0l-4 12q-51-11-96 0Z" fill="#21282e" stroke="#d3aa61" stroke-width="5"/>
      <path d="M532 221v-31h53v31" fill="#242c31" stroke="#d5ac63" stroke-width="4"/>
      <path d="M518 230v30m12-30v35m12-37v32m55-31v31m11-28v29" stroke="#cfa75e" stroke-width="2"/>
      <g fill="#e8c77e"><circle cx="518" cy="261" r="3"/><circle cx="530" cy="266" r="3"/><circle cx="542" cy="261" r="3"/><circle cx="597" cy="261" r="3"/><circle cx="608" cy="262" r="3"/></g>
      <g class="tassel"><path d="M574 190q17-17 35-19" fill="none" stroke="#bd6c4e" stroke-width="5"/><path d="m608 170 17 9-18 6Z" fill="#b85743"/></g>
    </g>

    <!-- Ink-style title seal -->
    <g transform="translate(79 82)">
      <text x="0" y="0" fill="#2a3335" font-size="48" font-weight="700" letter-spacing="8" font-family="serif">始皇出行</text>
      <path d="M1 17h256" stroke="#aa6045" stroke-width="3"/>
      <text x="2" y="47" fill="#6f5b4b" font-size="17" letter-spacing="5" font-family="serif">千 年 之 后 · 依 然 领 先</text>
      <rect x="264" y="-44" width="49" height="49" rx="3" fill="#a44d3e"/>
      <text x="272" y="-6" fill="#f8e7c7" font-size="32" font-family="serif">秦</text>
    </g>
    <text x="1124" y="675" text-anchor="end" fill="#e8d2ab" font-size="15" letter-spacing="3" font-family="serif">公元前 221 → 今天</text>
  </svg>
</body>
</html>
